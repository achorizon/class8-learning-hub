<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Quiz | Class 8 Learning Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Class 8 Daily Quiz</h1>
    <p>10 Questions · New Quiz Every Day</p>
  </header>


  <main>

    <section class="quiz-container">

      <h2>Today's Quiz</h2>

      <div class="quiz-subject-select">
  <label for="subjectSelect">Choose Subject:</label>

  <select id="subjectSelect">
    <option value="english">English</option>
    <option value="science">Science</option>
    <option value="maths">Maths</option>
    <option value="social">Social Studies</option>
    <option value="nepali">Nepali</option>
    <option value="computer">Computer</option>
    <option value="health">Health</option>
  </select>
</div>
      
      <p id="quizDate"></p>

      <div id="quiz"></div>

      <button id="submitBtn">
        Submit Quiz
      </button>

      <div id="result"></div>

      <button id="retryBtn" style="display:none;">
        Try Again
      </button>

    </section>

  </main>


  <footer>
    <span>© 2026 AC HORIZON LEARNING HUB</span>
    <span>Created by Aniket Chaudhary</span>
  </footer>


  <script src="quiz.js"></script>

</body>
</html>
